name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Syntax check pong.js
        run: node --check pong.js

      - name: Confirm the page wires up the game
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f pong.js
          grep -q 'src="pong.js"' index.html
          grep -q 'id="gameCanvas"' index.html
          grep -q 'id="playerScore"' index.html
          grep -q 'id="computerScore"' index.html
          grep -q 'id="gameOver"' index.html
